name: Build bootc Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      wifi_ssid:
        description: 'Wi-Fi SSID (optional)'
        required: false
        type: string
      wifi_password:
        description: 'Wi-Fi Password (optional)'
        required: false
        type: string

jobs:
  build-bootc:
    name: Build bootc Container & Disk Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build OCI Container Image
        env:
          WIFI_SSID: ${{ inputs.wifi_ssid || secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ inputs.wifi_password || secrets.WIFI_PASSWORD }}
        run: |
          podman build \
            --build-arg WIFI_SSID="${WIFI_SSID}" \
            --build-arg WIFI_PASSWORD="${WIFI_PASSWORD}" \
            -f bootc/Containerfile \
            -t dashboard-bootc:latest .

      - name: Prepare Disk Image Output Directory
        run: |
          mkdir -p output

      - name: Build Bootable Disk Image via bootc-image-builder
        run: |
          podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            quay.io/bootc/bootc-image-builder:latest \
            --type qcow2 \
            --local \
            dashboard-bootc:latest

      - name: Upload Disk Image Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dashboard-bootc-qcow2
          path: output/qcow2/disk.qcow2
