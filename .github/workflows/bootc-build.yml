name: Build bootc Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-bootc:
    name: Build bootc Container & Disk Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for GHCR Image Reference
        id: image_ref
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build OCI Container Image
        run: |
          podman build -f bootc/Containerfile \
            -t dashboard-bootc:latest \
            -t ${{ steps.image_ref.outputs.IMAGE_NAME }}:latest \
            -t ${{ steps.image_ref.outputs.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push OCI Container Image to GHCR
        run: |
          podman push ${{ steps.image_ref.outputs.IMAGE_NAME }}:latest
          podman push ${{ steps.image_ref.outputs.IMAGE_NAME }}:${{ github.sha }}
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            podman tag dashboard-bootc:latest ${{ steps.image_ref.outputs.IMAGE_NAME }}:${TAG_NAME}
            podman push ${{ steps.image_ref.outputs.IMAGE_NAME }}:${TAG_NAME}
          fi

      - name: Prepare Disk Image Output Directory
        run: |
          mkdir -p output

      - name: Build Bootable Disk Image via bootc-image-builder
        run: |
          podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            quay.io/bootc/bootc-image-builder:latest \
            --type qcow2 \
            --local \
            dashboard-bootc:latest

      - name: Upload Disk Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-bootc-qcow2
          path: output/qcow2/disk.qcow2
