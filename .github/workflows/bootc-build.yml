name: Build bootc Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-bootc:
    name: Build bootc Container & Disk Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build OCI Container Image
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          podman build \
            --build-arg WIFI_SSID="$WIFI_SSID" \
            --build-arg WIFI_PASSWORD="$WIFI_PASSWORD" \
            -f bootc/Containerfile \
            -t dashboard-bootc:latest .

      - name: Prepare Disk Image Output Directory
        run: |
          mkdir -p output

      - name: Build Bootable Disk Image via bootc-image-builder
        run: |
          podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            quay.io/bootc/bootc-image-builder:latest \
            --type qcow2 \
            --local \
            dashboard-bootc:latest

      - name: Upload Disk Image Artifact
        uses: actions/upload-artifact@b4f157630b939161f5b12d20738d761b103e5d41 # v4.4.3
        with:
          name: dashboard-bootc-qcow2
          path: output/qcow2/disk.qcow2
